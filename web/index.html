<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kartOS</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --card:#f3f3f1; --accent:#2f6fed; --user:#e7eefc; --ok:#1e8e3e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#eee; --muted:#9a9a9a; --card:#222; --accent:#6c9bff; --user:#23304d; --ok:#5fd37f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:640px; margin:0 auto; padding:24px 16px 96px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  button { font:inherit; padding:10px 20px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button.stop { background:#c0392b; }
  #status { padding:4px 10px; border-radius:999px; background:var(--card); color:var(--muted); font-size:14px; }
  #status.live { color:var(--ok); }
  #log { display:flex; flex-direction:column; gap:8px; }
  .msg { padding:10px 14px; border-radius:14px; max-width:85%; background:var(--card); }
  .msg.user { align-self:flex-end; background:var(--user); }
  .sys { color:var(--muted); font-size:13px; align-self:center; }
  #lat { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>kartOS</h1>
  <p class="sub">Talk naturally. Interrupt any time. Use headphones for best results.</p>
  <div class="bar">
    <button id="btn">Start call</button>
    <span id="status">idle</span>
  </div>
  <div id="log"></div>
  <div id="lat"></div>
</main>

<script>
const IN_RATE = 16000, OUT_RATE = 24000;
const $ = id => document.getElementById(id);
let ws, micCtx, outCtx, stream, node, nextTime = 0, sources = [], live = false;

// AudioWorklet: box-filter downsample from the device rate to 16 kHz, emit int16 chunks (20 ms)
const workletSrc = `
class Down extends AudioWorkletProcessor {
  constructor(){ super(); this.ratio = sampleRate / ${IN_RATE}; this.pos = 0; this.acc = 0; this.n = 0; this.buf = []; }
  process(inputs){
    const ch = inputs[0][0]; if (!ch) return true;
    for (let k = 0; k < ch.length; k++) {
      this.acc += ch[k]; this.n++; this.pos++;
      if (this.pos >= this.ratio) {
        this.pos -= this.ratio;
        const v = Math.max(-1, Math.min(1, this.acc / this.n));
        this.acc = 0; this.n = 0;
        this.buf.push(Math.round(v * 32767));
        if (this.buf.length >= 320) { this.port.postMessage(new Int16Array(this.buf)); this.buf = []; }
      }
    }
    return true;
  }
}
registerProcessor('down', Down);`;

function say(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + (cls || ''); d.textContent = text;
  $('log').appendChild(d); d.scrollIntoView({block:'end'});
  return d;
}
function sys(text) {
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = text;
  $('log').appendChild(d); d.scrollIntoView({block:'end'});
}
function setStatus(t, on) { $('status').textContent = t; $('status').className = on ? 'live' : ''; }

function playPcm(buf) {
  const i16 = new Int16Array(buf), f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
  const ab = outCtx.createBuffer(1, f32.length, OUT_RATE);
  ab.copyToChannel(f32, 0);
  const src = outCtx.createBufferSource();
  src.buffer = ab; src.connect(outCtx.destination);
  const at = Math.max(outCtx.currentTime + 0.02, nextTime);
  src.start(at); nextTime = at + ab.duration;
  sources.push(src); src.onended = () => { sources = sources.filter(s => s !== src); };
}
function stopPlayback() { sources.forEach(s => { try { s.stop(); } catch (e) {} }); sources = []; nextTime = 0; }

function onEvent(e) {
  switch (e.name) {
    case 'speech_start': setStatus('listening…', true); break;
    case 'user': say(e.text, 'user'); setStatus('thinking…', true); break;
    case 'agent': say(e.text); setStatus('speaking…', true); break;
    case 'duck': setStatus('listening…', true); break;
    case 'backchannel': sys('(backchannel ignored, agent continues)'); break;
    case 'interrupted': stopPlayback(); sys('(interrupted)'); break;
    case 'merged': sys('(merged with your earlier words)'); break;
    case 'error': sys('error: ' + e.error); break;
    case 'metrics': $('lat').textContent = 'Last response latency: ' + e.TOTAL + ' ms  (' +
        Object.entries(e).filter(([k]) => !['type','name','TOTAL'].includes(k)).map(([k,v]) => k + ' ' + v).join(', ') + ')'; break;
  }
}

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  outCtx = new AudioContext({ sampleRate: OUT_RATE });
  micCtx = new AudioContext();
  const url = URL.createObjectURL(new Blob([workletSrc], { type: 'application/javascript' }));
  await micCtx.audioWorklet.addModule(url);
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.binaryType = 'arraybuffer';
  await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error('WebSocket failed')); });
  node = new AudioWorkletNode(micCtx, 'down');
  node.port.onmessage = ev => { if (ws.readyState === 1) ws.send(ev.data.buffer); };
  micCtx.createMediaStreamSource(stream).connect(node);
  ws.onmessage = m => (typeof m.data === 'string') ? onEvent(JSON.parse(m.data)) : playPcm(m.data);
  ws.onclose = () => { if (live) stop(); };
  live = true; setStatus('connected', true); sys('Call started. Say something!');
}

function stop() {
  live = false;
  try { ws && ws.close(); } catch (e) {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  try { micCtx && micCtx.close(); outCtx && outCtx.close(); } catch (e) {}
  stopPlayback(); setStatus('idle', false); sys('Call ended.');
  $('btn').textContent = 'Start call'; $('btn').className = '';
}

$('btn').onclick = async () => {
  if (live) return stop();
  try { await start(); $('btn').textContent = 'End call'; $('btn').className = 'stop'; }
  catch (e) { sys('Could not start: ' + e.message + ' (mic needs localhost or HTTPS)'); stop(); }
};
</script>
</body>
</html>
